{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "huggingface-model-downloader.authSecretName" . }}
  labels:
    {{- include "huggingface-model-downloader.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "auth.username is required when auth.enabled=true" .Values.auth.username | quote }}
  password: {{ required "auth.password is required when auth.enabled=true" .Values.auth.password | quote }}
{{- end }}
