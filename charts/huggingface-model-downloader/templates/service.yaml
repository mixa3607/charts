apiVersion: v1
kind: Service
metadata:
  name: {{ include "huggingface-model-downloader.fullname" . }}
  labels:
    {{- include "huggingface-model-downloader.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  {{- if eq $.Values.service.type "LoadBalancer" }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "huggingface-model-downloader.selectorLabels" . | nindent 4 }}
