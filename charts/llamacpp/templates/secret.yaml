apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}-app-configuration
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: llamacpp
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  {{- range $k, $v := index .Values "app-configuration" }}
  {{ $k }}: {{ include "common.tplvalues.render" (dict "value" $v "context" $) | quote }}
  {{- end }}
  {{- if and .Values.models .Values.models.presets }}
  {{ .Values.models.filename | default "models.ini" }}: |-
    {{- include "llamacpp.renderModelsIni" . | nindent 4 }}
  {{- end }}
